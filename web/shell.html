<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warp Journey</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ccd; font: 15px/1.5 system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; outline: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; pointer-events: none; }
  #status.err { color: #f88; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading the warp drive&hellip;</div>
<script>
  var statusEl = document.getElementById('status');
  function fail(msg) { statusEl.className = 'err'; statusEl.innerHTML = msg; }
  // WebGL2 is required (fragment-shader raytracer)
  (function () {
    var c = document.createElement('canvas');
    if (!c.getContext('webgl2')) fail('This needs WebGL2, which this browser or GPU doesn’t offer.<br>Try a current Chrome, Edge, Firefox or Safari.');
  })();
  var canvas = document.getElementById('canvas');
  canvas.addEventListener('click', function () { canvas.focus(); });
  canvas.addEventListener('webglcontextlost', function (e) {
    fail('The GPU gave up on a frame (WebGL context lost).<br>Reload the page, and press F2 to lower the render scale.');
    e.preventDefault();
  }, false);
  var Module = {
    canvas: canvas,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    onRuntimeInitialized: function () { if (statusEl.className !== 'err') statusEl.style.display = 'none'; canvas.focus(); },
  };
  window.onerror = function () { fail('Something went wrong &mdash; see the browser console.'); };
</script>
{{{ SCRIPT }}}
</body>
</html>
